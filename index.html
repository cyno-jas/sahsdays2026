
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHS Days 2026 QR Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 22px;
      text-align: center;
      color: #5f6368;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    select, input {
      border: 1px solid #c9cdd2;
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
    }

    .primary {
      background: #174ea6;
      color: white;
    }

    .secondary {
      background: #e8eaed;
      color: #202124;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
    }

    #status {
      padding: 13px;
      margin-top: 16px;
      border-radius: 8px;
      background: #f1f3f4;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .note {
      font-size: 12px;
      color: #5f6368;
      line-height: 1.5;
      margin-top: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>SAHS Days 2026</h1>
    <p class="subtitle">QR Attendance Scanner</p>

    <label for="group">Attendance Group</label>
    <select id="group">
      <option value="participant">Participant</option>
      <option value="committee">Working Committee</option>
    </select>

    <label for="checkpoint">Checkpoint</label>
    <select id="checkpoint"></select>

    <button id="startButton" class="primary" type="button">
      Start Camera Scanner
    </button>

    <button id="stopButton" class="secondary" type="button">
      Stop Camera
    </button>

    <div id="reader"></div>

    <label for="manualId">Enter ID Manually</label>
    <input
      id="manualId"
      type="text"
      placeholder="Enter the ID number"
      autocomplete="off"
    >

    <button id="submitButton" class="primary" type="button">
      Submit ID
    </button>

    <div id="status" role="status" aria-live="polite">
      Select the attendance group and checkpoint to begin.
    </div>

    <p class="note">
      Keep this page open while scanning. A message that a request was
      submitted does not confirm that Google Sheets saved it. Verify the
      attendance log during testing.
    </p>
  </main>

  <script>
    // Replace this with your deployed Apps Script Web App URL.
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwTc4BujrhyucwOp1BZTpfHUwsyr5Th8BRJsT58aAH5BV6BSizkPG8WCQUoWZ7avK9e2w/exec";

    const participantCheckpoints = [
      "Morning In",
      "Morning Out",
      "Afternoon In",
      "Afternoon Out"
    ];

    const committeeCheckpoints = [
      "Committee In",
      "Committee Out"
    ];

    const groupSelect = document.getElementById("group");
    const checkpointSelect = document.getElementById("checkpoint");
    const statusBox = document.getElementById("status");
    const manualId = document.getElementById("manualId");

    let scanner = null;
    let scannerRunning = false;
    let processingScan = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function updateCheckpoints() {
      const options = groupSelect.value === "committee"
        ? committeeCheckpoints
        : participantCheckpoints;

      checkpointSelect.innerHTML = "";

      options.forEach(function (checkpoint) {
        const option = document.createElement("option");
        option.value = checkpoint;
        option.textContent = checkpoint;
        checkpointSelect.appendChild(option);
      });
    }

    groupSelect.addEventListener("change", updateCheckpoints);

    async function startScanner() {
      if (scannerRunning) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus("Scanner library did not load. Check your internet connection.");
        return;
      }

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 }
          },
          function (decodedText) {
            if (processingScan) return;

            processingScan = true;
            submitScan(decodedText);

            // Prevent the same QR from being processed repeatedly
            // while it remains in front of the camera.
            setTimeout(function () {
              processingScan = false;
            }, 2500);
          },
          function () {
            // Ignore individual frames without a QR code.
          }
        );

        scannerRunning = true;
        setStatus("Camera is running. Point it at a QR code.");
      } catch (error) {
        setStatus(
          "Could not start the camera. Allow camera access and use the HTTPS GitHub Pages URL."
        );
      }
    }

    async function stopScanner() {
      if (!scanner || !scannerRunning) return;

      try {
        await scanner.stop();
        await scanner.clear();
        scannerRunning = false;
        scanner = null;
        setStatus("Camera stopped.");
      } catch (error) {
        setStatus("Could not stop the camera cleanly. Reload the page if needed.");
      }
    }

    function submitScan(rawId) {
      const id = String(rawId || "").trim();

      if (!id) {
        setStatus("No ID was detected.");
        return;
      }

      if (SCRIPT_URL.indexOf("PASTE_YOUR_APPS_SCRIPT") !== -1) {
        setStatus("Setup incomplete: add your Apps Script Web App URL.");
        return;
      }

      const payload = {
        action: "recordScan",
        id: id,
        checkpoint: checkpointSelect.value,
        group: groupSelect.value
      };

      setStatus(
        "Submitting ID " + id + " for " + checkpointSelect.value +
        ". Checking the Google Sheet is still necessary."
      );

      // text/plain avoids a JSON preflight request. no-cors means the
      // browser cannot read the server response, so success cannot be
      // confirmed from this page.
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(function () {
        setStatus(
          "Request submitted for ID " + id +
          " (" + checkpointSelect.value + "). " +
          "This is not a confirmed save. Verify the Google Sheets log."
        );
        manualId.value = "";
      })
      .catch(function () {
        setStatus(
          "The request could not be sent. Check your internet connection, " +
          "Apps Script deployment, and Web App URL."
        );
      });
    }

    document.getElementById("startButton")
      .addEventListener("click", startScanner);

    document.getElementById("stopButton")
      .addEventListener("click", stopScanner);

    document.getElementById("submitButton")
      .addEventListener("click", function () {
        submitScan(manualId.value);
      });

    manualId.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        submitScan(manualId.value);
      }
    });

    updateCheckpoints();
  </script>
</body>
</html>
